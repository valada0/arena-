<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campeonato | ARENA+</title>
  <link rel="stylesheet" href="style.css">
  <script src="campeonato.js" defer></script>
</head>
<body>
  <header class="topo">
    <a href="index.html" class="logo">ARENA<span>+</span></a>
    <nav><a href="index.html">← Voltar ao início</a></nav>
  </header>
  <main>
    <section class="apresentacao">
      <span class="etiqueta">CENTRAL DA COMPETIÇÃO</span>
      <h1 id="tituloCampeonato">Carregando campeonato...</h1>
      <p id="infoCampeonato"></p>
    </section>
    <section class="secao">
      <div class="titulo-secao">
        <div>
          <h2>Gerenciar campeonato</h2>
          <p>Registre resultados e acompanhe a competição.</p>
        </div>
        <button class="botao-desfazer" id="desfazerCampeonato">Desfazer campeonato</button>
      </div>
      <div class="abas">
        <button class="aba ativa" data-aba="jogos">Jogos</button>
        <button class="aba" data-aba="classificacao">Classificação</button>
        <button class="aba" data-aba="chaveamento">Chaveamento</button>
      </div>
      <div id="conteudoCampeonato" class="conteudo-fases"></div>
    </section>
  </main>
  <dialog id="modalPlacar" class="modal-placar">
    <form method="dialog" class="painel-modal" id="formPlacar">
      <div class="cabecalho-modal">
        <h2>Editar placar</h2>
        <button type="button" class="fechar-modal" id="fecharModal" aria-label="Fechar">×</button>
      </div>
      <p id="confrontoModal" class="mensagem-info"></p>
      <div class="campos-placar-modal">
        <label><span id="equipeAModal"></span><input id="placarAModal" type="number" min="0" step="1" required></label>
        <span>×</span>
        <label><span id="equipeBModal"></span><input id="placarBModal" type="number" min="0" step="1" required></label>
      </div>
      <div class="desistencia-modal">
        <span>Registrar desistência:</span>
        <button type="button" class="botao-desistencia" id="desistenciaA"></button>
        <button type="button" class="botao-desistencia" id="desistenciaB"></button>
      </div>
      <div class="acoes-modal">
        <button type="button" class="aba" id="cancelarModal">Cancelar</button>
        <button type="submit" class="botao">Salvar placar</button>
      </div>
    </form>
  </dialog>
  <footer>
    <a href="index.html" class="logo">ARENA<span>+</span></a>
    <p>Seu esporte. Sua competição. Sua história.</p>
  </footer>
</body>
</html>
